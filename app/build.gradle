plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.lectormobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.lectormobile"
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName "1.4.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libjniPdfium.so']
            excludes += ['**/*.dll']
        }
    }
}

// AndroidPdfViewer mantenido (fork oothp) publicado en Maven Central.
// pdfium 1.9.5-beta01 está compilado con max-page-size=16 KB (requisito Play 2025).
// Mismo paquete: com.github.barteksc.pdfviewer
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation('io.github.oothp:android-pdf-viewer:3.2.0-beta06') {
        // El visor solo usa APIs básicas de core; evitamos subir
        // compileSdk/AGP por una dependencia runtime innecesaria.
        exclude group: 'androidx.core', module: 'core'
    }
    testImplementation 'junit:junit:4.13.2'
}
