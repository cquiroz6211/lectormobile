plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.lectormobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.lectormobile"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            pickFirsts += ['**/libjniPdfium.so']
            excludes += ['**/libmodpdfium.so']
            excludes += ['**/*.dll']
        }
    }
}

// ✅ Verificada con Context7 y JitPack: com.github.barteksc:AndroidPdfViewer:2.0.2
// Source: /dimuthuupe/androidpdfviewer on Context7 + JitPack confirmed (2025-10-19)
// JitPack: https://jitpack.io/#com.github.barteksc/AndroidPdfViewer
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation('com.github.barteksc:AndroidPdfViewer:2.0.2') {
        exclude group: 'com.android.support', module: 'support-v4'
    }
}
